name: Keep Render Backend Alive

on:
  schedule:
    - cron: "*/5 * * * *"  # Every 5 minutes
  workflow_dispatch:       # Manual run

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Render Backend
        run: |
          curl -s https://manodwip-backend.onrender.com || echo "Failed to ping"
